name: Raccolta contenuti

on:
  schedule:
    - cron: "*/30 * * * *" # ogni 30 minuti (GitHub può ritardare di qualche minuto)
  workflow_dispatch: # permette di lanciarla a mano dal sito GitHub

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run ingest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
