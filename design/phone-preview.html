<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Radar · anteprima telefono</title>
  <!--
    Strumento di sviluppo, NON fa parte dell'app.
    Mostra http://localhost:3000 dentro una cornice da iPhone 17 (402 x 874 punti).
    Serve il server acceso: npm run dev.
  -->
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
      background: #2a2a2e; font-family: system-ui, sans-serif; color: #ddd; overflow: hidden;
    }
    .stage { width: 430px; height: 902px; transform-origin: center center; flex: none; }
    .phone {
      width: 430px; height: 902px; padding: 14px; border-radius: 64px;
      background: #0b0b0c; box-shadow: 0 0 0 3px #4a4a50, 0 30px 80px rgba(0,0,0,.55);
      position: relative;
    }
    .screen { width: 402px; height: 874px; border-radius: 50px; overflow: hidden; background: #17150f; position: relative; }
    iframe { width: 402px; height: 874px; border: 0; display: block; background: #17150f; }
    .island {
      position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
      width: 120px; height: 34px; border-radius: 20px; background: #000; z-index: 5; pointer-events: none;
    }
    .bar {
      position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
      width: 140px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.55); z-index: 5; pointer-events: none;
    }
    .tools { display: flex; gap: 10px; align-items: center; font-size: 13px; }
    button {
      font: inherit; color: #fff; background: #3b3b42; border: 1px solid #555; border-radius: 8px;
      padding: 6px 12px; cursor: pointer;
    }
    button:hover { background: #4a4a52; }
  </style>
</head>
<body>
  <div class="tools">
    <button id="reload">↻ Ricarica (rivedi la splash)</button>
    <span id="hint">localhost:3000</span>
  </div>
  <div class="stage" id="stage">
    <div class="phone">
      <div class="island"></div>
      <div class="screen"><iframe id="app" src="http://localhost:3000" title="Radar"></iframe></div>
      <div class="bar"></div>
    </div>
  </div>
  <script>
    // Riduce la cornice se la finestra è bassa, così sta sempre tutta a vista
    const stage = document.getElementById("stage");
    function fit() {
      const room = window.innerHeight - 60;
      const s = Math.min(1, room / 902);
      stage.style.transform = "scale(" + s + ")";
      stage.style.marginBlock = (-(902 * (1 - s)) / 2) + "px";
    }
    addEventListener("resize", fit); fit();
    document.getElementById("reload").onclick = () => {
      document.getElementById("app").src = "http://localhost:3000/?t=" + Date.now();
    };
  </script>
</body>
</html>
